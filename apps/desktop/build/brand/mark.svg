<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cold Open mark: a screenplay page held by two brass brads, a fountain-pen nib finishing its last line, on
       Backlot's navy so the two apps read as a pair. The tile sits at 80% with a drop shadow, like macOS icons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a52"/>
      <stop offset="1" stop-color="#18202e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.44" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6FA0F0"/>
      <stop offset="1" stop-color="#3D72D0"/>
    </linearGradient>
    <radialGradient id="brad" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FBE58A"/>
      <stop offset="1" stop-color="#D9A92E"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect x="6.4" y="7.4" width="51.2" height="51.2" rx="11.2" fill="#000" opacity="0.35" filter="url(#shadow)"/>
  <g transform="translate(6.4 6.4) scale(0.8)">
    <g clip-path="url(#tile)">
      <rect width="64" height="64" fill="url(#bg)"/>
      <rect width="64" height="64" fill="url(#glow)"/>

      <!-- the page, a touch rotated, with its shadow -->
      <g transform="rotate(-4 30 32)">
        <rect x="14.6" y="10.6" width="30" height="40" rx="1.6" fill="#000" opacity="0.35" filter="url(#pageShadow)"/>
        <rect x="14" y="9.5" width="30" height="40" rx="1.6" fill="#ffffff"/>
        <!-- brass brads in the binding margin -->
        <circle cx="17.6" cy="15.5" r="1.45" fill="url(#brad)"/>
        <circle cx="17.6" cy="43.5" r="1.45" fill="url(#brad)"/>
        <!-- screenplay lines: scene heading, action, a centred cue, dialogue, action being written -->
        <g fill="#2b3a52">
          <rect x="21" y="15" width="15" height="1.6" rx="0.8"/>
          <rect x="21" y="19.6" width="18" height="1.3" rx="0.65" opacity="0.55"/>
          <rect x="21" y="22.6" width="13" height="1.3" rx="0.65" opacity="0.55"/>
          <rect x="27.5" y="27.4" width="6.5" height="1.4" rx="0.7"/>
          <rect x="24" y="30.4" width="13" height="1.3" rx="0.65" opacity="0.55"/>
          <rect x="24" y="33.4" width="10" height="1.3" rx="0.65" opacity="0.55"/>
        </g>
        <!-- the line the nib is writing, in ink blue -->
        <path d="M21 39 H29.8" stroke="#3D72D0" stroke-width="1.4" stroke-linecap="round"/>
      </g>

      <!-- fountain-pen nib, tip at the end of the inked line -->
      <g transform="translate(30.4 39.2) rotate(140)">
        <path d="M0 0 L-3.3 -9.5 Q-3.6 -12.4 -2.4 -14.2 L2.4 -14.2 Q3.6 -12.4 3.3 -9.5 Z" fill="url(#nib)"/>
        <path d="M0 0 L0 -8.6" stroke="#1d2a40" stroke-width="0.55" stroke-linecap="round"/>
        <circle cx="0" cy="-9.4" r="0.95" fill="#1d2a40"/>
        <rect x="-2.6" y="-22.5" width="5.2" height="8.6" rx="1" fill="#e8edf5"/>
        <rect x="-2.6" y="-16.4" width="5.2" height="1.3" fill="#F2D04A"/>
      </g>
    </g>
  </g>
</svg>
